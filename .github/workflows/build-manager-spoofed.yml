name: 构建管理器（牢大爱肘击 / KernelSU-Next）

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-manager-spoofed:
    runs-on: ubuntu-latest
    steps:
      - name: 检出本仓库
        uses: actions/checkout@v7

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: 准备 Android SDK（v3.4.2 只需 API 36）
        run: |
          SDK="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
          SM="$(find "$SDK/cmdline-tools" -maxdepth 3 -name sdkmanager -type f | head -n1)"
          echo "sdkmanager: $SM"
          yes | "$SM" --licenses >/dev/null 2>&1 || true
          "$SM" "platforms;android-36" "build-tools;36.1.0" "platform-tools" >/dev/null || \
          "$SM" "platforms;android-36" "build-tools;36.0.0" "platform-tools" >/dev/null
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"

      - name: 克隆 KernelSU-Next（含 spoof 脚本）
        run: |
          git clone --depth 1 -b v3.4.2 https://github.com/KernelSU-Next/KernelSU-Next.git ksunext
          test -d ksunext/manager
          test -f ksunext/manager/spoof

      - name: 随机包名（KernelSU-Next 原生 spoof）
        working-directory: ksunext/manager
        run: |
          chmod +x spoof
          ./spoof

      - name: 换成牢大爱肘击（名称 / 图标 / 背景）
        run: bash scripts/manager_spoof/theme_next.sh ksunext/manager

      - name: 放入 ksud 二进制
        run: |
          mkdir -p ksunext/manager/app/src/main/jniLibs/arm64-v8a ksunext/manager/app/src/main/jniLibs/x86_64
          curl -fsSL -o ksunext/manager/app/src/main/jniLibs/arm64-v8a/libksud.so \
            https://github.com/KernelSU-Next/KernelSU-Next/releases/download/v3.4.2/ksud-aarch64-linux-android
          curl -fsSL -o ksunext/manager/app/src/main/jniLibs/x86_64/libksud.so \
            https://github.com/KernelSU-Next/KernelSU-Next/releases/download/v3.4.2/ksud-x86_64-linux-android
          ls -l ksunext/manager/app/src/main/jniLibs/arm64-v8a

      - name: 生成签名密钥
        run: |
          KS="$GITHUB_WORKSPACE/manager-spoof.jks"
          KSPASS=$(tr -dc "A-Za-z0-9" </dev/urandom | head -c16)
          keytool -genkeypair -keystore "$KS" -storepass "$KSPASS" -keypass "$KSPASS" \
            -alias spoof -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Suki, OU=Spoof, O=Spoof, L=Spoof, S=Spoof, C=CN"
          {
            echo "KEYSTORE_FILE=$KS"
            echo "KEYSTORE_PASSWORD=$KSPASS"
            echo "KEY_ALIAS=spoof"
            echo "KEY_PASSWORD=$KSPASS"
          } >> ksunext/manager/gradle.properties
          echo "KEYSTORE_FILE=$KS" >> "$GITHUB_ENV"

      - name: 构建
        working-directory: ksunext/manager
        run: |
          chmod +x gradlew
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
          ./gradlew --no-daemon clean assembleRelease

      - name: 收集 APK
        run: |
          mkdir -p out
          find ksunext/manager/app/build/outputs/apk/release -name "*.apk" -exec cp {} out/ \;
          ls -l out
          cd out && for f in *.apk; do mv "$f" "${f%.apk}-spoofed.apk"; done && ls -l

      - name: 上传 APK
        uses: actions/upload-artifact@v7
        with:
          name: manager-spoofed
          path: out/*.apk
          if-no-files-found: error