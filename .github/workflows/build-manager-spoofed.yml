name: 构建管理器（Spoofed）

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-manager-spoofed:
    runs-on: ubuntu-latest
    steps:
      - name: 检出本仓库
        uses: actions/checkout@v7

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: 准备 Android SDK（用 runner 预装的 sdkmanager）
        run: |
          SDK="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
          SM="$(find "$SDK/cmdline-tools" -maxdepth 3 -name sdkmanager -type f | head -n1)"
          echo "sdkmanager: $SM"
          yes | "$SM" --licenses >/dev/null 2>&1 || true
          "$SM" --channel=3 "platforms;android-37" "build-tools;37.0.0" "platform-tools" >/dev/null ||           "$SM" "platforms;android-37" "build-tools;37.0.0" "platform-tools" >/dev/null
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"

      - name: 克隆 SukiSU 管理器源码
        run: |
          git clone --depth 1 -b main https://git.zako.shirkneko.top:20004/shirkneko/SukiSU.git sukisu
          test -d sukisu/manager

      - name: 生成随机包名与签名密钥
        run: bash scripts/manager_spoof/gen.sh

      - name: 应用「牢大爱肘击」图标与背景
        run: bash scripts/manager_spoof/theme.sh sukisu/manager

      - name: 构建 spoofed 管理器
        working-directory: sukisu/manager
        run: |
          chmod +x gradlew
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
          ./gradlew --no-daemon clean assembleRelease \
            -PKSU_PACKAGE_NAME="$SPOOF_PKG" \
            -PKSU_NAME="$SPOOF_NAME" \
            -PKEYSTORE_FILE="$KEYSTORE_FILE" \
            -PKEYSTORE_PASSWORD="$KEYSTORE_PASSWORD" \
            -PKEY_ALIAS="$KEY_ALIAS" \
            -PKEY_PASSWORD="$KEY_PASSWORD"

      - name: 收集 APK
        run: |
          mkdir -p out
          find sukisu/manager -name "*.apk" -path "*release*" -exec cp {} out/ \;
          ls -l out
          for f in out/*.apk; do mv "$f" "${f%.apk}-spoofed.apk"; done
          ls -l out

      - name: 上传 APK
        uses: actions/upload-artifact@v7
        with:
          name: manager-spoofed
          path: out/*.apk
          if-no-files-found: error